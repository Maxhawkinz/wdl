<!DOCTYPE html>
<html>
<head>
  <title>registration form</title>
  <style>
    body {
      font-family: Arial;
      background-color: seashell;
      padding: 20px;
    }

    h1 {color: black;text-align: center;}

    label {font-weight: bold;}

    input[type="text"],
    input[type="email"],
    input[type="date"] {
      padding: 8px;width: 250px;border: 1px solid slategray;margin-top: 5px;}

    input[type="radio"] {margin-right: 5px;}

    input[type="submit"] {padding: 10px 20px;background-color: green;color: white;border: none;cursor: pointer;
                          font-size: 15px;margin-top: 10px;}

    input[type="submit"]:hover {background-color: springgreen;}

    p {margin-top: 12px;}
  </style>
</head>
<body>
  <h1><u>Registration Form</u></h1>
  <form>
    <p>
      <label>Name</label><br>
      <input type="text" placeholder="Enter Name" required>
    </p>
    <p>
      <label>Email ID</label><br>
      <input type="email" placeholder="Enter Email" required>
    </p>
    <p>
      <label>Gender:</label><br>
      <input type="radio" name="gender"> Male
      <input type="radio" name="gender"> Female
      <input type="radio" name="gender"> Other
    </p>
    <p>
      <label>Date of Birth:</label><br>
      <input type="date" name="dob" required>
    </p>
    <p>
      <input type="submit" value="Submit">
    </p>
  </form>
</body>
</html>
