<!DOCTYPE html>
<html>
<head>
  <title>Bootstrap</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar bg-dark">
    <div class="container">
      <a class="navbar-brand text-white">My Website</a>
    </div>
  </nav>

  <div class="container mt-4">
    <h2 class="text-center">Bootstrap Grid</h2>

    <!-- Grid with 3 Cards -->
    <div class="row mt-3">
      <div class="col-md-4">
        <div class="card p-3 text-center">
          <h5>Name</h5>
          <p>Ajay</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 text-center bg-warning">
          <h5>Branch</h5>
          <p>Computer Engineering</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 text-center bg-success text-white">
          <h5>Year</h5>
          <p>Second Year</p>
        </div>
      </div>
    </div>

    <!-- Button -->
    <button class="btn btn-primary mt-3">Click Me</button>

    <!-- Alert -->
    <div class="alert alert-info mt-3">Welcome to Bootstrap Practical!</div>

    <!-- Table -->
    <table class="table table-bordered mt-3">
      <thead class="table-dark">
        <tr><th>Name</th><th>Roll No</th><th>Marks</th></tr>
      </thead>
      <tbody>
        <tr><td>Ajay</td><td>101</td><td>90</td></tr>
        <tr><td>Ram</td><td>102</td><td>75</td></tr>
      </tbody>
    </table>
  </div>

</body>
</html>
